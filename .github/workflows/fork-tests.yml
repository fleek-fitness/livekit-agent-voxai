name: Fork regression tests

on:
  pull_request:
    branches: ['fork-*']
    paths-ignore: ['**/*.md']
  push:
    branches: ['fork-*']
    paths-ignore: ['**/*.md']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-extras --dev
      - run: uv run --no-sync python -c "import nltk; nltk.download('punkt_tab', raise_on_error=True)"
      - run: uv run --no-sync pytest --unit --audio_eot

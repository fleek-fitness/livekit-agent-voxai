name: Startup timing checks
on:
  pull_request:
    paths:
      - livekit-agents/livekit/agents/ipc/proc_pool.py
      - livekit-agents/livekit/agents/ipc/startup_timing.py
      - tests/test_startup_timing.py
      - .github/workflows/startup-timing-check.yml
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./livekit-agents pytest pytest-asyncio ruff
      - run: pytest tests/test_startup_timing.py --unit
      - run: ruff check livekit-agents/livekit/agents/ipc/proc_pool.py livekit-agents/livekit/agents/ipc/startup_timing.py tests/test_startup_timing.py
      - run: ruff format --check livekit-agents/livekit/agents/ipc/proc_pool.py livekit-agents/livekit/agents/ipc/startup_timing.py tests/test_startup_timing.py
